<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<title>Tiên Ảnh — Kênh phim hoạt hình AI</title>
<meta name="description" content="Tiên Ảnh — tuyển tập kênh review và phim hoạt hình 3D tu tiên, xuyên không.">
<meta property="og:title" content="Tiên Ảnh">
<meta property="og:description" content="Tuyển tập kênh review và phim hoạt hình 3D tu tiên, xuyên không.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E13; --bg2:#11151C; --card:#161B23; --line:#232A34;
  --tx:#E9ECF1; --tx2:#98A1AE; --tx3:#5F6875;
  --gold:#E9A93C; --gold-dim:#8A6420; --yt:#FF3D3D; --dm:#3FA9F5;
  --r:4px; --pad:clamp(16px,4vw,44px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:"Be Vietnam Pro",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.display{font-family:"Archivo","Be Vietnam Pro",sans-serif;font-variation-settings:"wdth" 110;
  font-weight:800;letter-spacing:-.015em;line-height:1.04;overflow-wrap:break-word}
.mono{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"Roboto Mono",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx3)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font-family:inherit;font-size:15px;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 var(--pad)}

header{position:sticky;top:0;z-index:60;background:#0B0E13;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:58px}
.brand{font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 118;font-weight:900;
  font-size:19px;text-transform:uppercase;flex:1}
.brand b{color:var(--gold)}
.brand i{font-style:normal;font-size:11px;color:var(--tx3);letter-spacing:.1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 17px;
  border-radius:999px;font-size:13.5px;font-weight:500;border:1px solid var(--line);transition:.16s}
.btn:hover{border-color:var(--tx2)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#17120A;font-weight:600}
.btn-heart{border-color:#B8446A;color:#FF7FA5}
.btn-heart:hover{background:#B8446A;color:#fff;border-color:#B8446A}

.hero{padding:clamp(38px,7vw,78px) 0 clamp(28px,4vw,46px);border-bottom:1px solid var(--line);text-align:center}
.hero h1{margin:12px 0 0;font-size:clamp(34px,7vw,64px)}
.hero h1 b{color:var(--gold)}
.hero p{max-width:56ch;margin:16px auto 0;color:var(--tx2);font-size:clamp(14px,1.4vw,16.5px)}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
.pill{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:5px 14px;font-size:12.5px;color:var(--tx2)}

section{padding:clamp(30px,5vw,52px) 0;border-bottom:1px solid var(--line)}
.sec-head{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.sec-head h2{margin:0;font-size:clamp(19px,2.4vw,26px)}
.sec-head .dot{width:9px;height:9px;border-radius:50%;flex:none}
.sec-head .n{margin-left:auto;font-family:"Roboto Mono",monospace;font-size:11px;color:var(--tx3)}

.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.kcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:14px 15px;transition:.16s}
.kcard:hover{transform:translateY(-2px)}
.kcard .av{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff}
.kcard .av img{width:100%;height:100%;object-fit:cover}
.kcard .tx{flex:1;min-width:0}
.kcard .tx b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.kcard .tx span{display:block;font-size:12.5px;color:var(--tx3);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kcard .go{flex:none;font-size:13px;font-weight:600}
.kcard.yt .av{background:var(--yt)} .kcard.yt .go{color:#FF6B6B}
.kcard.yt:hover{border-color:var(--yt);box-shadow:0 8px 26px -18px var(--yt)}
.kcard.dm .av{background:var(--dm)} .kcard.dm .go{color:#7BC4FA}
.kcard.dm:hover{border-color:var(--dm);box-shadow:0 8px 26px -18px var(--dm)}
.trong{color:var(--tx3);font-size:14px;padding:14px 0}

/* bình luận */
.cmt-warn{font-size:12.5px;color:var(--tx3);background:var(--bg2);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 12px;margin-bottom:14px}
.cmt-form{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.cmt-form textarea{border:1px solid var(--line);background:var(--bg2);border-radius:var(--r);
  padding:12px 14px;min-height:88px;resize:vertical;outline:none}
.cmt-form textarea:focus{border-color:var(--gold-dim)}
.cmt-form .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cmt-form input{border:1px solid var(--line);background:var(--bg2);border-radius:var(--r);padding:10px 13px;outline:none;width:210px}
.cmt{display:grid;grid-template-columns:38px 1fr;gap:13px;padding:15px 0;border-top:1px solid var(--line)}
.av2{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--gold);
  color:#17120A;font-weight:600;font-size:15px}
.cmt .who{font-weight:500;font-size:14px}
.cmt .when{font-family:"Roboto Mono",monospace;font-size:10.5px;color:var(--tx3);margin-left:8px}
.cmt p{margin:4px 0 0;font-size:14.5px;color:var(--tx2);white-space:pre-wrap}
.trong.c{text-align:center;padding:30px 0}

/* ủng hộ */
.modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .veil{position:absolute;inset:0;background:rgba(4,6,9,.84)}
.modal .sheet{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;
  width:min(400px,100%);max-height:88vh;overflow:auto;padding:26px 24px;text-align:center}
.modal .xx{position:absolute;top:8px;right:12px;font-size:24px;line-height:1;color:var(--tx3)}
.qr{width:210px;height:210px;margin:16px auto 14px;border-radius:8px;background:#fff;padding:8px;object-fit:contain}
.mm{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--bg2);
  border:1px solid var(--line);border-radius:999px;padding:10px 16px;margin:0 0 8px}
.mm b{font-family:"Roboto Mono",monospace;font-size:17px}
.mm button{color:var(--gold);font-size:12.5px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);z-index:200;background:var(--gold);
  color:#17120A;font-weight:500;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.22s}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{padding:28px 0 42px;color:var(--tx3);font-size:12.5px;text-align:center}

@media(max-width:640px){
  input,textarea{font-size:16px!important}
  .bar{height:52px;gap:10px}
  .brand{font-size:15px}
  .hero{padding:30px 0 26px}
  .hero h1{font-size:clamp(28px,9vw,40px)}
  .kgrid{grid-template-columns:1fr}
  .kcard{padding:12px 13px;gap:12px}
  .kcard .av{width:46px;height:46px}
  .cmt-form input{width:100%}
  .cmt-form .row{flex-direction:column;align-items:stretch}
  .cmt-form .row .btn{width:100%}
}
@media(hover:none){ .kcard:hover{transform:none} .kcard:active{transform:scale(.99)} }
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="brand">Tiên<b>Ảnh</b><i>.TOP</i></div>
    <button class="btn btn-heart" id="uhBtn" style="display:none">♥ Ủng hộ</button>
  </div>
</header>

<div class="wrap hero">
  <div class="eyebrow">Tuyển tập kênh</div>
  <h1 class="display">Tiên <b>Ảnh</b></h1>
  <p id="gt">Nơi tập hợp toàn bộ kênh của mình. Chọn kênh bạn muốn xem, bấm vào là sang thẳng nơi đăng video.</p>
  <div class="stats" id="stats"></div>
</div>

<div class="wrap">
  <section id="secYT">
    <div class="sec-head">
      <span class="dot" style="background:var(--yt)"></span>
      <h2 class="display">Kênh YouTube</h2>
      <span class="n" id="nYT"></span>
    </div>
    <div class="kgrid" id="ytList"></div>
  </section>

  <section id="secDM">
    <div class="sec-head">
      <span class="dot" style="background:var(--dm)"></span>
      <h2 class="display">Kênh Dailymotion</h2>
      <span class="n" id="nDM"></span>
    </div>
    <div class="kgrid" id="dmList"></div>
  </section>

  <section style="border-bottom:0">
    <div class="sec-head">
      <span class="dot" style="background:var(--gold)"></span>
      <h2 class="display">Góc trò chuyện</h2>
      <span class="n" id="cmtCount"></span>
    </div>
    <div class="cmt-warn" id="cmtWarn" style="display:none">Bình luận đang ở chế độ tạm — tải lại trang là mất.</div>
    <div class="cmt-form">
      <textarea id="cmtText" placeholder="Bạn muốn xem thể loại nào tiếp theo? Góp ý gì cũng được…"></textarea>
      <div class="row">
        <input id="cmtName" placeholder="Tên của bạn" value="Khách">
        <button class="btn btn-gold" id="cmtSend">Gửi</button>
      </div>
    </div>
    <div id="cmtList"></div>
  </section>
</div>

<footer>TIÊN ẢNH · <span id="nam"></span></footer>

<div class="modal" id="uhModal" role="dialog" aria-modal="true">
  <div class="veil" data-x></div>
  <div class="sheet">
    <button class="xx" data-x aria-label="Đóng">×</button>
    <div class="eyebrow">Ủng hộ</div>
    <h2 class="display" style="font-size:24px;margin:8px 0 6px">Mời mình ly cà phê</h2>
    <p style="color:var(--tx2);font-size:13.5px;margin:0" id="uhLoi"></p>
    <div id="uhQR"></div>
    <div class="mm" id="uhSoBox"><b id="uhSo"></b><button id="uhCopy">Sao chép</button></div>
    <div style="color:var(--tx3);font-size:12.5px" id="uhTen"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const CFG = { momoSo:"", momoTen:"", momoQR:"", loiCamOn:"", supaUrl:"", supaKey:"", gioiThieu:"", kenh:[] };
const esc = v => String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2200); }
$("#nam").textContent = new Date().getFullYear();

const svgYT = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2s-.2-1.4-.8-2c-.8-.8-1.6-.8-2-.9C16 4.1 12 4.1 12 4.1s-4 0-6.8.2c-.4.1-1.2.1-2 .9-.6.6-.8 2-.8 2S2.2 8.8 2.2 10.5v1.6c0 1.6.2 3.3.2 3.3s.2 1.4.8 2c.8.8 1.8.8 2.2.9 1.6.1 6.6.2 6.6.2s4 0 6.8-.2c.4-.1 1.2-.1 2-.9.6-.6.8-2 .8-2s.2-1.6.2-3.3v-1.6c0-1.6-.2-3.3-.2-3.3ZM9.9 14.3V8.6l5.2 2.9-5.2 2.8Z"/></svg>`;
const svgDM = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 2.9v7.2a4.9 4.9 0 1 0 .6 6.3v1.5h4.3V2.9h-4.9Zm-2.3 12.9a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2Z"/></svg>`;

function veKenh(){
  const ds = (CFG.kenh || []).filter(k => k && k.ten && k.url);
  const nhom = { youtube:[], dailymotion:[] };
  ds.forEach(k => {
    const nt = (k.nenTang || (/dailymotion/i.test(k.url) ? "dailymotion" : "youtube")).toLowerCase();
    (nhom[nt] || nhom.youtube).push(k);
  });
  ve("#ytList", nhom.youtube, "yt", svgYT, "Kênh YouTube");
  ve("#dmList", nhom.dailymotion, "dm", svgDM, "Kênh Dailymotion");
  $("#nYT").textContent = nhom.youtube.length ? nhom.youtube.length + " kênh" : "";
  $("#nDM").textContent = nhom.dailymotion.length ? nhom.dailymotion.length + " kênh" : "";
  $("#secYT").style.display = nhom.youtube.length ? "" : "none";
  $("#secDM").style.display = nhom.dailymotion.length ? "" : "none";
  $("#stats").innerHTML = ds.length
    ? `<span class="pill">${ds.length} kênh</span>` +
      (nhom.youtube.length ? `<span class="pill">${nhom.youtube.length} trên YouTube</span>` : "") +
      (nhom.dailymotion.length ? `<span class="pill">${nhom.dailymotion.length} trên Dailymotion</span>` : "")
    : "";
  if(!ds.length){
    $("#secYT").style.display = "";
    $("#ytList").innerHTML = `<p class="trong">Chưa khai báo kênh nào. Mở <b>admin.html</b> → ♥ Cài đặt trang để thêm.</p>`;
  }
}
function ve(sel, ds, lop, icon, mm){
  $(sel).innerHTML = ds.map(k=>`
    <a class="kcard ${lop}" href="${esc(k.url)}" target="_blank" rel="noopener">
      <span class="av">${k.anh ? `<img src="${esc(k.anh)}" alt="" loading="lazy">` : icon}</span>
      <span class="tx"><b>${esc(k.ten)}</b><span>${esc(k.mota || mm)}</span></span>
      <span class="go">Xem ↗</span>
    </a>`).join("");
}

/* ---------- bình luận ---------- */
const TAM = [];
const coSupa = ()=> !!(CFG.supaUrl && CFG.supaKey);
const hSupa = ()=> ({ apikey: CFG.supaKey, Authorization:"Bearer " + CFG.supaKey, "Content-Type":"application/json" });
function khiNao(iso){
  if(!iso) return "";
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if(s < 60) return "vừa xong";
  if(s < 3600) return Math.floor(s/60) + " phút trước";
  if(s < 86400) return Math.floor(s/3600) + " giờ trước";
  if(s < 2592000) return Math.floor(s/86400) + " ngày trước";
  return new Date(iso).toLocaleDateString("vi-VN");
}
function veBL(list){
  $("#cmtCount").textContent = list.length ? list.length + " bình luận" : "";
  $("#cmtList").innerHTML = list.length ? list.map(c=>`
    <div class="cmt"><div class="av2">${esc(String(c.ten||"?")[0].toUpperCase())}</div>
    <div><span class="who">${esc(c.ten)}</span><span class="when">${esc(c.when || khiNao(c.tao_luc))}</span>
    <p>${esc(c.noidung)}</p></div></div>`).join("")
    : `<div class="trong c">Chưa có ai nhắn gì. Bạn mở hàng nhé.</div>`;
}
async function taiBL(){
  $("#cmtWarn").style.display = coSupa() ? "none" : "block";
  if(!coSupa()) return veBL(TAM);
  $("#cmtList").innerHTML = `<div class="trong c">Đang tải…</div>`;
  try{
    const u = `${CFG.supaUrl}/rest/v1/binhluan?phim=eq.trang&tap=eq.0&order=tao_luc.desc&limit=200`;
    const r = await fetch(u, { headers: hSupa() });
    if(!r.ok) throw 0;
    veBL(await r.json());
  }catch(e){ $("#cmtList").innerHTML = `<div class="trong c">Không tải được bình luận lúc này.</div>`; }
}
$("#cmtSend").onclick = async ()=>{
  const noi = $("#cmtText").value.trim();
  const ten = ($("#cmtName").value.trim() || "Khách").slice(0,40);
  if(!noi){ $("#cmtText").focus(); return toast("Nhập nội dung trước đã."); }
  if(noi.length > 1000) return toast("Dài quá, rút ngắn giúp mình.");
  if(!coSupa()){ TAM.unshift({ten, noidung:noi, when:"vừa xong"}); $("#cmtText").value=""; return veBL(TAM); }
  const n = $("#cmtSend"), cu = n.textContent;
  n.textContent = "Đang gửi…"; n.disabled = true;
  try{
    const r = await fetch(`${CFG.supaUrl}/rest/v1/binhluan`, {
      method:"POST", headers:{...hSupa(), Prefer:"return=minimal"},
      body: JSON.stringify({ phim:"trang", tap:0, ten, noidung:noi })
    });
    if(!r.ok) throw 0;
    $("#cmtText").value = ""; toast("Đã gửi, cảm ơn bạn."); taiBL();
  }catch(e){ toast("Gửi không được, thử lại sau nhé."); }
  finally{ n.textContent = cu; n.disabled = false; }
};

/* ---------- ủng hộ ---------- */
function dungUngHo(){
  if(!(CFG.momoSo || CFG.momoQR)) return;
  $("#uhBtn").style.display = "inline-flex";
  $("#uhLoi").textContent = CFG.loiCamOn || "Trang chạy được là nhờ mọi người ghé xem. Ủng hộ bao nhiêu cũng quý.";
  $("#uhQR").innerHTML = CFG.momoQR ? `<img class="qr" src="${esc(CFG.momoQR)}" alt="Mã QR">` : "";
  $("#uhSoBox").style.display = CFG.momoSo ? "flex" : "none";
  $("#uhSo").textContent = CFG.momoSo || "";
  $("#uhTen").textContent = CFG.momoTen ? "Chủ tài khoản: " + CFG.momoTen : "";
}
$("#uhBtn").onclick = ()=> $("#uhModal").classList.add("on");
document.querySelectorAll("#uhModal [data-x]").forEach(el => el.onclick = ()=> $("#uhModal").classList.remove("on"));
$("#uhCopy").onclick = async ()=>{
  try{ await navigator.clipboard.writeText(CFG.momoSo); toast("Đã sao chép số."); }
  catch(e){ toast("Không sao chép được."); }
};
addEventListener("keydown", e => { if(e.key === "Escape") $("#uhModal").classList.remove("on"); });

/* ---------- nạp ---------- */
(async function(){
  try{
    const r = await fetch("cauhinh.json?v=" + Date.now());
    if(r.ok) Object.assign(CFG, await r.json());
  }catch(e){}
  if(CFG.gioiThieu) $("#gt").textContent = CFG.gioiThieu;
  veKenh(); dungUngHo(); taiBL();
})();
</script>
</body>
</html>
